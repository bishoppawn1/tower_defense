<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#101e21">
  <title>Dead Current</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="menu">
    <canvas id="landscape" aria-hidden="true"></canvas>
    <div class="menu-inner">
      <div class="wordmark"><i class="beacon"></i> OUTPOST COMMAND</div>
      <div class="briefing">
        <h1>Dead<br><em>Current</em></h1>
        <p>Hold the outpost against the horde.</p>
        <label for="mapSelect">Deployment zone</label>
        <div class="launch">
          <select id="mapSelect" aria-describedby="mapSummary"></select>
          <button id="play">Start game <b aria-hidden="true">→</b></button>
        </div>
        <div class="map-intel">
          <canvas id="mapDiagram" width="244" height="132" aria-hidden="true"></canvas>
          <div><strong id="mapProfile"></strong><p id="mapSummary" aria-live="polite"></p></div>
        </div>
      </div>
    </div>
  </div>
  <header>
    <div class="brand"><i class="beacon"></i><h1>Dead <em>Current</em></h1></div>
    <div class="stats"><span>Wave <b id="wave">0</b></span><span>Supplies <b id="money">250</b></span><span>Base <b id="health">20</b></span></div>
    <button id="start">Start wave →</button>
  </header>
  <main>
    <section>
      <div class="board"><canvas id="game" width="2000" height="1300" aria-label="Outpost battlefield"></canvas>
        <div id="placementLegend" hidden><i class="valid-dot"></i> Buildable <i class="blocked-dot"></i> Blocked</div>
        <div class="hint"><span>→ &nbsp; Horde entry</span><span>Outpost &nbsp; ◈</span></div>
      </div>
      <div class="foot"><span>Select a tower to inspect it · Esc cancels placement</span><button id="cancel" hidden>Cancel placement</button><span id="status">Prepare your defenses</span></div>
    </section>
    <aside><div class="asidehead"><small>Armory</small><h2>Build defenses</h2></div><div id="shop"></div></aside>
  </main>
  <div id="upgradeDialog" class="tower-panel" hidden><button id="closeDetails" aria-label="Close upgrades">×</button><div id="details"></div></div>
  <div id="notice" role="status" hidden></div>
  <script src="art.js"></script><script src="maps.js"></script><script src="upgrades.js"></script><script src="waves.js"></script><script src="game.js"></script>
</body>
</html>
